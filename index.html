<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEET Guru - Aapka Dost aur Teacher</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--me:#2563eb;--ai:#334155;--txt:#f1f5f9;--acc:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,"Noto Sans Devanagari",sans-serif;height:100dvh;display:flex;flex-direction:column}
  header{padding:10px 14px;background:var(--card);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  header h1{font-size:18px;margin:0;flex:1 1 100%}
  select,button{background:#0b1220;color:var(--txt);border:1px solid #475569;border-radius:10px;padding:8px 10px;font-size:14px}
  #chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;font-size:16px}
  .me{align-self:flex-end;background:var(--me)}
  .ai{align-self:flex-start;background:var(--ai)}
  footer{padding:10px;background:var(--card);display:flex;gap:8px;align-items:center}
  #text{flex:1;padding:12px;border-radius:12px;border:1px solid #475569;background:#0b1220;color:var(--txt);font-size:15px}
  #mic{background:var(--acc);color:#04210e;font-weight:700;border:0;width:52px;height:52px;border-radius:50%;font-size:22px}
  #mic.on{background:#ef4444;color:#fff;animation:p 1s infinite}
  @keyframes p{50%{transform:scale(1.1)}}
  #send{background:var(--me);border:0}
  #status{font-size:12px;opacity:.9;padding:0 14px 4px;min-height:18px}
  .quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 6px}
  .quick button{font-size:12px;padding:6px 10px}
</style>
</head>
<body>
<header>
  <h1>🩺 NEET Guru – Aapka Dost aur Teacher</h1>
  <select id="mode">
    <option value="samjhao">📖 Samjhao (Teacher)</option>
    <option value="quiz">❓ Quiz (Mujhse sawaal pucho)</option>
    <option value="doubt">🤔 Doubt Solve</option>
    <option value="revision">⚡ Quick Revision</option>
  </select>
  <select id="cls"><option>Class 11</option><option>Class 12</option></select>
  <select id="sub"><option>Physics</option><option>Chemistry</option><option>Biology</option></select>
  <select id="voice" title="Awaaz chuno">
    <option value="Orus">🎙 Orus (Zeno jaisi, firm)</option>
    <option value="Alnilam">🎙 Alnilam (firm)</option>
    <option value="Charon">🎙 Charon (Holt jaisi, informative)</option>
    <option value="Iapetus">🎙 Iapetus (Nyx jaisi, clear)</option>
    <option value="Achird">🎙 Achird (Elio jaisi, friendly)</option>
    <option value="Sadaltager">🎙 Sadaltager (knowledgeable)</option>
  </select>
  <select id="speed" title="Bolne ki speed">
    <option value="slow">🐢 Dheere</option>
    <option value="normal">🙂 Normal</option>
  </select>
  <button id="voiceToggle">🔊 Awaaz: ON</button>
  <button id="hands">🎧 Hands-free: OFF</button>
  <button id="stop">⏹ Chup</button>
</header>
<div id="chat"></div>
<div class="quick">
  <button data-q="Mujhe is chapter ka pura concept samjhao: ">Chapter samjhao</button>
  <button data-q="Mujhse is chapter ke 5 NEET level sawaal pucho, ek ek karke: ">Quiz lo</button>
  <button data-q="Isko aur simple karke samjhao, example ke saath.">Aur simple</button>
  <button data-q="Aage badho.">Aage badho</button>
</div>
<div id="status"></div>
<footer>
  <button id="mic" title="Bolo">🎤</button>
  <input id="text" placeholder="Yahan likho ya 🎤 dabake bolo..." autocomplete="off">
  <button id="send">Bhejo</button>
</footer>

<script>
const $ = s => document.querySelector(s);
const chat = $('#chat'), status = $('#status'), text = $('#text');
let history = [];
let voiceOn = true, handsFree = false, listening = false, speaking = false, busy = false;
let playToken = 0, curResolve = null, lastTtsErr = '';
const audioEl = new Audio();
audioEl.preload = 'auto';

function addMsg(role, t){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'me' : 'ai');
  d.textContent = t;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
addMsg('model', 'नमस्ते! 😊 मैं आपका NEET Guru हूँ। Class और subject चुनो, फिर chapter का नाम बोलो या लिखो, जैसे "Cell: The Unit of Life समझाओ"। 🎤 दबाकर सीधे बोल भी सकते हो!');

// ---------- Text cleanup & splitting ----------
function cleanForSpeech(t){
  return t.replace(/[*_#`>~|]/g,' ').replace(/^\s*[-•]\s+/gm,'').replace(/\s+/g,' ').trim();
}
function splitText(t){
  const sents = t.match(/[^।.!?\n]+[।.!?\n]?/g) || [t];
  const out = []; let cur = '';
  for (const s of sents){
    const limit = out.length === 0 ? 160 : 700;   // pehla tukda chhota => awaaz jaldi shuru
    if (cur && (cur + s).length > limit){ out.push(cur.trim()); cur = s; } else cur += s;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

// ---------- Gemini voice (server) ----------
async function fetchAudio(part){
  try {
    const style = $('#speed').value === 'slow'
      ? 'speaking slowly and clearly like a calm, friendly teacher'
      : 'clear, calm and friendly teacher';
    const r = await fetch('/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: part, voice: $('#voice').value, style })
    });
    if (!r.ok){
      let msg = '';
      if (r.status === 404) msg = 'tts.js file GitHub me nahi mili (functions/tts.js)';
      else { try { msg = (await r.json()).error; } catch(e){} }
      lastTtsErr = msg || ('error ' + r.status);
      return null;
    }
    return await r.arrayBuffer();
  } catch(e){ lastTtsErr = 'internet problem'; return null; }
}

// Kai WAV tukde jod kar ek hi audio bana do => beech me pause nahi, screen band hone par bhi chalta rahe
function wavPcm(b){
  const v = new DataView(b); let o = 12;
  while (o + 8 <= b.byteLength){
    const id = String.fromCharCode(v.getUint8(o), v.getUint8(o+1), v.getUint8(o+2), v.getUint8(o+3));
    const size = v.getUint32(o + 4, true);
    if (id === 'data') return new Uint8Array(b, o + 8, Math.min(size, b.byteLength - o - 8));
    o += 8 + size + (size % 2);
  }
  return new Uint8Array(b, 44);
}
function mergeWav(buffers){
  const pcms = buffers.map(wavPcm);
  const total = pcms.reduce((a, p) => a + p.length, 0);
  const out = new Uint8Array(44 + total);
  const dv = new DataView(out.buffer);
  const w = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  w(0,'RIFF'); dv.setUint32(4, 36 + total, true); w(8,'WAVE'); w(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,24000,true); dv.setUint32(28,48000,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  w(36,'data'); dv.setUint32(40, total, true);
  let p = 44; pcms.forEach(x => { out.set(x, p); p += x.length; });
  return out;
}
function playBytes(bytes){
  return new Promise(res => {
    const url = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
    const done = () => { URL.revokeObjectURL(url); curResolve = null; res(); };
    curResolve = done;
    audioEl.onended = audioEl.onerror = done;
    audioEl.src = url;
    audioEl.play().catch(done);
  });
}
function browserSpeak(t){
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'hi-IN'; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(x => x.lang === 'hi-IN');
    if (v) u.voice = v;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}
function setMedia(){
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({ title: 'NEET Guru', artist: 'Aapka Teacher' });
      navigator.mediaSession.setActionHandler('pause', () => stopSpeaking());
    }
  } catch(e){}
}
function stopSpeaking(){
  playToken++;
  try { audioEl.pause(); } catch(e){}
  if (curResolve) curResolve();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  speaking = false; status.textContent = '';
}
function finishSpeaking(token){
  if (token !== playToken) return;
  speaking = false;
  if (!status.textContent.startsWith('⚠️')) status.textContent = '';
  if (handsFree) startListen();
}
async function speakReply(reply){
  if (!voiceOn){ if (handsFree) startListen(); return; }
  const token = ++playToken;
  const parts = splitText(cleanForSpeech(reply));
  if (!parts.length){ if (handsFree) startListen(); return; }
  speaking = true; status.textContent = '🔊 Awaaz taiyaar ho rahi hai...';
  const jobs = parts.map(p => fetchAudio(p));   // sabhi tukde ek saath bante hain
  const first = await jobs[0];
  if (token !== playToken) return;

  if (!first){
    status.textContent = '⚠️ Gemini awaaz nahi chali (' + lastTtsErr + '). Phone ki awaaz chal rahi hai.';
    for (const p of parts){ if (token !== playToken) return; await browserSpeak(p); }
    return finishSpeaking(token);
  }
  setMedia();
  status.textContent = '🔊 Bol raha hu...';
  const rest = Promise.all(jobs.slice(1));
  await playBytes(first);
  if (token !== playToken) return;

  const bufs = await rest;
  if (token !== playToken) return;
  let group = [];
  for (let i = 0; i < bufs.length; i++){
    if (bufs[i]) group.push(bufs[i]);
    else {
      if (group.length){ await playBytes(mergeWav(group)); group = []; }
      if (token !== playToken) return;
      await browserSpeak(parts[i + 1]);
    }
    if (token !== playToken) return;
  }
  if (group.length) await playBytes(mergeWav(group));
  finishSpeaking(token);
}

// ---------- Speech to Text (Hindi) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR){
  rec = new SR();
  rec.lang = 'hi-IN'; rec.continuous = false; rec.interimResults = true;
  rec.onresult = e => {
    let final = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript;
    }
    text.value = final || interim;
    if (final) { stopListen(); send(); }
  };
  rec.onend = () => { listening = false; $('#mic').classList.remove('on'); if (!busy && !speaking && handsFree) startListen(); };
  rec.onerror = e => { listening = false; $('#mic').classList.remove('on'); if (e.error === 'not-allowed') status.textContent = '⚠️ Mic ki permission do.'; };
}
function startListen(){
  if (!rec || listening || speaking) return;
  try { rec.start(); listening = true; $('#mic').classList.add('on'); status.textContent = '🎤 Sun raha hu... boliye'; } catch(e){}
}
function stopListen(){ if (rec && listening){ try{ rec.stop(); }catch(e){} } }

$('#mic').onclick = () => {
  if (!SR){ alert('Is browser me voice input nahi hai. Chrome use karo.'); return; }
  stopSpeaking();
  listening ? stopListen() : startListen();
};

// ---------- Send to AI ----------
async function send(){
  const q = text.value.trim();
  if (!q || busy) return;
  stopSpeaking();
  text.value = '';
  addMsg('user', q);
  history.push({ role: 'user', text: q });
  busy = true; status.textContent = '🤔 Soch raha hu...';
  const holder = addMsg('model', '...');
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: history.slice(-14),
        mode: $('#mode').value, cls: $('#cls').value, sub: $('#sub').value
      })
    });
    const data = await r.json();
    const isErr = !data.reply;
    const reply = data.reply || ('⚠️ ' + (data.error || 'Kuch gadbad hui, dobara try karo.'));
    holder.textContent = reply;
    chat.scrollTop = chat.scrollHeight;
    busy = false; status.textContent = '';
    if (!isErr){
      history.push({ role: 'model', text: reply });
      speakReply(reply);
    } else {
      history.pop();
    }
  } catch (e){
    busy = false; holder.textContent = '⚠️ Internet ya server ki problem. Dobara try karo.'; status.textContent = '';
  }
}
$('#send').onclick = send;
text.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// ---------- Hindi (India) voices Google se laao ----------
(async function loadVoices(){
  try {
    const r = await fetch('/voices');
    if (!r.ok) return;
    const data = await r.json();
    const list = (data.voices || []).filter(v => v.id);
    if (!list.length) return;
    const sel = $('#voice');
    const old = sel.innerHTML;
    sel.innerHTML = '<optgroup label="🇮🇳 Hindi (India) male voices">' +
      list.map(v => '<option value="' + v.id + '">🎙 ' + v.name +
        (v.pitch ? ' (' + v.pitch + (v.accent ? ', ' + v.accent : '') + ')' : '') + '</option>').join('') +
      '</optgroup><optgroup label="Dusri voices">' + old + '</optgroup>';
    sel.selectedIndex = 0;
  } catch(e){}
})();

// ---------- Controls ----------
$('#voiceToggle').onclick = e => { voiceOn = !voiceOn; e.target.textContent = '🔊 Awaaz: ' + (voiceOn ? 'ON' : 'OFF'); if (!voiceOn) stopSpeaking(); };
$('#hands').onclick = e => {
  handsFree = !handsFree; e.target.textContent = '🎧 Hands-free: ' + (handsFree ? 'ON' : 'OFF');
  if (handsFree){ voiceOn = true; $('#voiceToggle').textContent = '🔊 Awaaz: ON'; startListen(); } else stopListen();
};
$('#stop').onclick = () => stopSpeaking();
document.querySelectorAll('.quick button').forEach(b => b.onclick = () => { text.value = b.dataset.q; text.focus(); });
</script>
</body>
</html>
